name: medical-report-stack

services:
  report-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: medical-report-app:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:18082:8000"
    environment:
      MEDICAL_DB_PATH: /app/data/medical_report.db
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_TIMEOUT: ${DEEPSEEK_TIMEOUT:-60}
      DEEPSEEK_MAX_TOKENS: ${DEEPSEEK_MAX_TOKENS:-1200}
    volumes:
      - ./data:/app/data
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s

  report-tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    network_mode: host
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    command: ["tunnel", "--no-autoupdate", "run"]
    security_opt:
      - no-new-privileges:true
    depends_on:
      report-web:
        condition: service_healthy
